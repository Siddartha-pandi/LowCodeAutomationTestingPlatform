name: lowcode-automation-prod

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-automation_platform_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automation_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prod_redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      EMBED_WORKER: "false"
      RUN_MIGRATIONS: "true"
      DB_SYNCHRONIZE: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-localhost,127.0.0.1,*.company.internal,*.company.local}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      STORAGE_DIR: /app/storage
    volumes:
      - prod_storage:/app/storage
    ports:
      - "8000:8000"
    networks:
      - frontend_net
      - backend_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    shm_size: "2gb"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-localhost,127.0.0.1,*.company.internal,*.company.local}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      STORAGE_DIR: /app/storage
    volumes:
      - prod_storage:/app/storage
    networks:
      - backend_net
      - worker_egress_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  worker_egress_net:
    driver: bridge

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_storage:
