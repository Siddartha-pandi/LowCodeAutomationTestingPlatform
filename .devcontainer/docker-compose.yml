name: LowCodeAutomationTestingPlatform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: '2gb'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ..:/workspaces/LowCodeAutomationTestingPlatform:cached
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: ../.env
        required: true
    environment:
      # Redis connectivity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SYNCHRONIZE: "true"
      # Unified Backend settings (secrets loaded from ../.env via env_file)
      PORT: 8000
      STORAGE_DIR: /workspaces/LowCodeAutomationTestingPlatform/storage
      DEFAULT_TIMEZONE: Asia/Kolkata
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Frontend settings
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "false"
    ports:
      - "3000:3000"
      - "8000:8000"
    command: /bin/sh -c "while sleep 1000; do :; done"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devcontainer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  devcontainer_redis_data:
