name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-pipeline:
    name: Unified NestJS Backend Pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_platform_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_platform_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps

      - name: Install Playwright System Browsers
        working-directory: ./backend
        run: npx playwright install --with-deps chromium

      - name: Run Jest Unit and Entity Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automation_platform_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-ci-secret-for-jwt-tokens-32chars
          CREDENTIALS_MASTER_KEY: test-ci-aes-256-encryption-key-for-secrets
        run: npm test

      - name: Build Unified NestJS Distribution
        working-directory: ./backend
        run: npm run build

  frontend-pipeline:
    name: Next.js Frontend Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

  devcontainer-pipeline:
    name: Dev Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-pipeline, frontend-pipeline]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dev Container Image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: false
          tags: devcontainer:latest
