name: LowCodeAutomationTestingPlatform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: '2gb'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ..:/workspaces/LowCodeAutomationTestingPlatform:cached
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: ../.env
        required: true
    environment:
      # Redis connectivity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SYNCHRONIZE: "true"
      # Unified Backend settings
      PORT: 8000
      JWT_SECRET: 4be9367e7fb1cbfe36da95e281190c8367b38c48f7a5128e3bd015be867325ba
      JWT_SECRET_KEY: 4be9367e7fb1cbfe36da95e281190c8367b38c48f7a5128e3bd015be867325ba
      CREDENTIALS_MASTER_KEY: 47d0efd64879b9733be0317b85d2d490060ec45315ff45df38e8c3d39d855b23
      APP_ENCRYPTION_KEY: 47d0efd64879b9733be0317b85d2d490060ec45315ff45df38e8c3d39d855b23
      INTERNAL_SERVICE_KEY: 86d5b47c05751d8bf5194f23f310e0da87400c15a8afd57ab15e1216e2327d17
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!Secure
      STORAGE_DIR: /workspaces/LowCodeAutomationTestingPlatform/storage
      DEFAULT_TIMEZONE: Asia/Kolkata
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      # Frontend settings
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "false"
    ports:
      - "3000:3000"
      - "8000:8000"
    command: /bin/sh -c "while sleep 1000; do :; done"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devcontainer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  devcontainer_redis_data:
